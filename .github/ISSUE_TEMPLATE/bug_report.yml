name: 🐛 报告问题
description: funchat 哪里不对劲
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 描述你看到的现象，以及你期望的结果
      placeholder: 点击导出 PDF 后没有反应，期望弹出打印窗口
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开某个 AI 好友
        2. 点击右上角导出菜单
        3. 选择「导出PDF」
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 插件版本
      placeholder: 0.1.0
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options: [Windows, macOS, Linux]
  - type: input
    id: model
    attributes:
      label: API 路线与模型
      description: 与模型请求相关的问题请填写；不要贴出你的 API Key
      placeholder: 私有 API 路线 / gpt-4.1
